name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Recheck the lockfiles for new advisories every week.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Qualify ZIP creation on native ext-family
        if: runner.os == 'Linux'
        shell: bash
        run: |
          fixture_dir=$(mktemp -d "${RUNNER_TEMP:?}/zipfast-create.XXXXXX")
          trap 'rm -rf -- "$fixture_dir"' EXIT
          stat -f -c 'ZIP fixture filesystem: %T (%t)' "$fixture_dir"
          if [ "$(stat -f -c '%t' "$fixture_dir")" != ef53 ]; then
            printf '%s\n' 'ZIP creation qualification requires an ext-family fixture mount' >&2
            exit 1
          fi
          export TMPDIR="$fixture_dir"
          cargo test --locked --lib native_filesystem_qualification -- --nocapture
          cargo test --locked --test zip_create -- --nocapture
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --doc --locked

  zipview-msrv:
    name: Zipview on Rust 1.87
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.87.0
      - run: cargo +1.87.0 test -p zipview --locked

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit --file Cargo.lock
      - run: cargo audit --file crates/zipview/fuzz/Cargo.lock

  fuzz:
    name: Zipview fuzz (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: crates/zipview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # nightly
        with:
          toolchain: nightly
          components: rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            crates/zipview/fuzz -> target
      - run: cargo install cargo-fuzz --locked
      - run: cargo check --manifest-path fuzz/Cargo.toml --locked --bin fuzz_zip
      - run: cargo run --locked --example seedcheck
      - run: mkdir -p fuzz/corpus/fuzz_zip
      - run: cargo fuzz run fuzz_zip fuzz/corpus/fuzz_zip fuzz/seeds -- -max_total_time=120 -rss_limit_mb=4096
      - run: git diff --exit-code -- fuzz/Cargo.lock
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: crates/zipview/fuzz/artifacts/
          retention-days: 30
