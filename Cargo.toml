[package]
name = "zipfast"
version = "0.1.0"
edition = "2024"
description = "Fast universal archive extractor"
publish = false

[dependencies]
bzip2 = "0.6.1"
crc32fast = "1.5"
flate2 = "1"
liblzma = { version = "0.4.9", features = ["parallel", "static"] }
zstd = "0.14.3"

[[bin]]
name = "zipfast"
path = "src/main.rs"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[dev-dependencies]
flate2 = "1"
