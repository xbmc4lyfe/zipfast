[package]
name = "zipfast"
version = "0.1.0"
edition = "2024"
description = "Fast universal archive extractor"
publish = false

[dependencies]
crc32fast = "1.5"
flate2 = "1"

[[bin]]
name = "zipfast"
path = "src/main.rs"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[dev-dependencies]
flate2 = "1"
