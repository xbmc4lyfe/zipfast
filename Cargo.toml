[workspace]
members = ["crates/zipview"]
default-members = ["."]
exclude = ["crates/zipview/fuzz"]
resolver = "3"

[package]
name = "zipfast"
version = "0.1.0"
edition = "2024"
license = "RPL-1.5"
description = "Fast universal archive extractor"
publish = false

[dependencies]
bzip2 = "0.6.1"
crc32fast = "1.5"
flate2 = "1"
liblzma = { version = "0.4.9", features = ["parallel", "static"] }
subtle = "2.6"
zstd = "0.14.3"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[[bin]]
name = "zipfast"
path = "src/main.rs"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[dev-dependencies]
flate2 = "1"
