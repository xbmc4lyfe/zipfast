[package]
name = "zipview-fuzz"
version = "0.0.0"
edition = "2024"
license = "RPL-1.5"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
zipview = { path = ".." }

[[bin]]
name = "fuzz_zip"
path = "fuzz_targets/fuzz_zip.rs"
test = false
doc = false

# Keep the fuzz harness and its lockfile independent of the library workspace.
[workspace]
